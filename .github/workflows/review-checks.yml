name: Day 1 标准库与 Mock 检查

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Day 1 标准库与 Mock 检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 执行检查
        run: |
          python3 day1-submission/bug-fix-lab/test.py
          python3 day1-submission/rag-assistant/tests/test_basic.py
          python3 day1-submission/rag-assistant/tests/test_rag.py
